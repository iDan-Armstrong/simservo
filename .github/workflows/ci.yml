name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm ci --prefix worker
      - run: npm test --prefix worker

  parity:
    # The game's snapshots through the real rdsops evaluators, at the pinned commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build rdsops and egisops at their pinned refs
        run: |
          bash tools/fetch-rdsops.sh rdsops
          bash tools/fetch-rdsops.sh egisops
      - run: pip install build/rdsops/*.whl build/egisops/*.whl pytest
      - run: pytest -q tests/test_bridge.py

  e2e:
    # The built site in Chromium: real Pyodide, real wheel, wizard to gameplay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: bash tools/fetch-rdsops.sh rdsops
      - run: bash tools/fetch-rdsops.sh egisops
      - run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: SHOTS=1 npm run e2e
      - name: Accounts end to end (wrangler dev + virtual passkey)
        run: |
          npm ci --prefix worker
          SHOTS=1 npm run e2e:accounts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: test-results/

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/check-links.mjs
